<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b2b"><meta name="description" content="Offline-friendly checklist for all current PEAK badges."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon-192.png"><link rel="apple-touch-icon" href="assets/icon-192.png"><link rel="stylesheet" href="styles.css"><title>PEAK Badge Tracker</title></head><body>
<header class="hero"><div class="wrap"><div class="brand"><img src="assets/icon-192.png" alt="" width="56" height="56"><div><p class="eyebrow">SCOUT FIELD LOG</p><h1>PEAK Badge Tracker</h1></div></div><p class="sub">A fast, offline-friendly checklist for all 64 current badges.</p><div class="progress"><div><strong id="progressText">0 / 64</strong><span> badges earned</span></div><div class="bar" aria-hidden="true"><i id="progressBar"></i></div></div></div></header>
<main class="wrap"><section class="controls" aria-label="Badge filters"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search badges, tips, biomes…" autocomplete="off"></label><div class="filters"><select id="status"><option value="all">All progress</option><option value="todo">Not earned</option><option value="done">Earned</option></select><select id="biome"><option value="all">All biomes</option></select><select id="difficulty"><option value="all">All difficulties</option><option>Easy</option><option>Medium</option><option>Hard</option></select><select id="sort"><option value="default">Game order</option><option value="name">A–Z</option><option value="difficulty">Difficulty</option></select></div><div class="actions"><button id="install" hidden>Install app</button><button id="clear" class="ghost">Reset progress</button></div></section><p id="resultCount" class="result-count"></p><section id="badgeList" class="grid" aria-live="polite"></section><p id="empty" class="empty" hidden>No badges match those filters.</p></main>
<footer><div class="wrap">Unofficial fan-made tracker. PEAK is by Aggro Crab &amp; Landfall. Badge requirements can change with game updates.</div></footer><script src="app.js" defer></script></body></html>
